<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raksha bandhan Countdown</title>
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://staticgameryt-india.github.io/Rakshabandhan2026/" />
  <link rel="canonical" href="https://staticgameryt-india.github.io/Rakshabandhan2026/" />
  <meta property="og:title" content="Rakshabandhan Countdown" />
  <meta property="og:description" content="Hop in!" />
  <meta property="og:image" content="https://raw.githubusercontent.com/StaticGamerYT-India/Rakshabandhan2026/main/Embed%20image.png" />
  <meta property="og:image:secure_url" content="https://raw.githubusercontent.com/StaticGamerYT-India/Rakshabandhan2026/main/Embed%20image.png" />

  <meta name="twitter:image:alt" content="Rakshabandhan Countdown image preview" />

  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: clamp(12px, 2vw, 24px);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .wrap {
      width: min(1100px, 100%);
      max-width: 100%;
      text-align: center;
      padding: clamp(20px, 3vw, 32px) clamp(12px, 2vw, 18px);
      display: grid;
      justify-items: center;
      gap: clamp(14px, 2vw, 26px);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      letter-spacing: 0.02em;
    }

    .hype {
      margin: 20px 0 0;
      position: relative;
      min-height: 0;
      pointer-events: none;
    }

    .hype-field {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 12;
    }

    .hype-message {
      position: fixed;
      left: 0;
      top: 0;
      display: inline-block;
      max-width: min(72vw, 380px);
      padding: 0.92rem 1.15rem;
      border-radius: 22px;
      color: rgba(255, 255, 255, 0.97);
      font-size: clamp(0.92rem, 1.5vw, 1.08rem);
      line-height: 1.28;
      letter-spacing: 0.03em;
      text-wrap: balance;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24);
      opacity: 0;
      filter: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.34);
      touch-action: none;
      user-select: none;
      cursor: grab;
      pointer-events: auto;
      transform-origin: center center;
      will-change: transform, opacity;
    }

    .hype-message.is-dragging {
      transition: none;
      cursor: grabbing;
    }

    .hype-message::before,
    .hype-message::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.22;
    }

    .hype-message::before {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.22), transparent 68%);
      filter: blur(6px);
      transform: scale(1.02);
    }

    .hype-message::after {
      inset: -16px;
      background: radial-gradient(circle, rgba(255, 197, 84, 0.12), transparent 60%);
      filter: blur(10px);
      transform: scale(1.08);
    }

    .timer {
      display: grid;
      width: 100%;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
    }

    .unit {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px 12px 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 14px 32px rgba(255, 255, 255, 0.04);
    }

    .value {
      display: block;
      font-size: clamp(2rem, 7vw, 4.8rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .label {
      display: block;
      margin-top: 10px;
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .celebrate {
      margin-top: 10px;
      font-size: clamp(1.2rem, 2.2vw, 1.8rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      display: none;
    }

    .celebrate.show {
      display: block;
    }

    @media (max-width: 460px) {
      .wrap {
        padding: 14px 6px 18px;
      }

      .timer {
        gap: 10px;
      }

      .unit {
        padding: 18px 10px 14px;
        border-radius: 16px;
      }

      .hype-message {
        max-width: 88vw;
        padding: 0.8rem 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="wrap" aria-label="Raksha bandhan countdown timer">
    <h1>Raksha bandhan</h1>
    <p class="subtitle">A tiny countdown for big sibling energy.</p>

    <section class="timer" aria-live="polite">
      <div class="unit">
        <span class="value" id="weeks">00</span>
        <span class="label">Weeks</span>
      </div>
      <div class="unit">
        <span class="value" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="unit">
        <span class="value" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="unit">
        <span class="value" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="unit">
        <span class="value" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <div class="hype" aria-label="Floating sibling reminders">
      <div class="hype-field" id="hypeField" aria-live="polite"></div>
    </div>

    <div class="celebrate" id="celebrate">Happy Raksha bandhan</div>
    
  </main>

  <script>
    const weeksEl = document.getElementById('weeks');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const celebrateEl = document.getElementById('celebrate');
    const hypeFieldEl = document.getElementById('hypeField');

    const hypeLines = [
      'Nishtha ABCD yaad karke aana.',
      'Jinal time pe aajana',
      'Vibhu khota mat lagana pls',
      'Vidhi painting mat bhoolna',
      'Vivek bhaiya is baar aajana 😭',
      'SMEET IS BAR AYEGA',
      'Sabko aana hai, kya pata, kal ho na ho?'
    ];

    const floatingMessages = [];
    const spawnIntervalMs = 650;
    const totalMessages = hypeLines.length;

    let hypeIndex = 0;
    let messagesSpawned = 0;
    let messageTimer = null;
    let animationFrameId = null;
    let countdownComplete = false;

    function getTargetDate(now) {
      const year = now.getFullYear();
      let target = new Date(year, 7, 28, 0, 0, 0, 0);

      if (now > target) {
        target = new Date(year + 1, 7, 28, 0, 0, 0, 0);
      }

      return target;
    }

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function getMessageSize(element) {
      const rect = element.getBoundingClientRect();

      return {
        width: rect.width || 220,
        height: rect.height || 56
      };
    }

    function getViewportBounds(element) {
      const rect = element.getBoundingClientRect();

      return {
        minX: 14,
        maxX: Math.max(14, window.innerWidth - rect.width - 14),
        minY: 14,
        maxY: Math.max(14, window.innerHeight - rect.height - 18)
      };
    }

    function getRandomEdgePosition(element) {
      const size = getMessageSize(element);
      const padding = 16;
      const edge = Math.floor(Math.random() * 4);
      const horizontalMin = padding;
      const horizontalMax = Math.max(padding, window.innerWidth - padding - size.width);
      const verticalMin = padding;
      const verticalMax = Math.max(padding, window.innerHeight - padding - size.height);

      switch (edge) {
        case 0:
          return {
            x: clamp(Math.random() * window.innerWidth, horizontalMin, horizontalMax),
            y: verticalMin
          };
        case 1:
          return {
            x: horizontalMax,
            y: clamp(Math.random() * window.innerHeight, verticalMin, verticalMax)
          };
        case 2:
          return {
            x: clamp(Math.random() * window.innerWidth, horizontalMin, horizontalMax),
            y: verticalMax
          };
        default:
          return {
            x: horizontalMin,
            y: clamp(Math.random() * window.innerHeight, verticalMin, verticalMax)
          };
      }
    }

    function applyMessageTransform(message, scale = 1) {
      message.element.style.transform = `translate3d(${message.x}px, ${message.y}px, 0) rotate(${message.rotation}deg) scale(${scale})`;
    }

    function removeMessage(message) {
      if (!message) {
        return;
      }

      if (message.element && message.element.parentNode) {
        message.element.parentNode.removeChild(message.element);
      }

      const index = floatingMessages.indexOf(message);
      if (index !== -1) {
        floatingMessages.splice(index, 1);
      }
    }

    function spawnMessage(text, options = {}) {
      const isSticky = Boolean(options.sticky);

      if (!text) {
        text = hypeLines[hypeIndex % hypeLines.length];
      }

      hypeIndex = (hypeIndex + 1) % hypeLines.length;

      const element = document.createElement('div');
      element.className = 'hype-message';
      element.textContent = text;
      hypeFieldEl.appendChild(element);

      const now = performance.now();
      const startPosition = getRandomEdgePosition(element);
      const centerX = window.innerWidth * 0.5;
      const centerY = window.innerHeight * 0.5;
      const angle = Math.random() * Math.PI * 2;
      const speed = 90 + Math.random() * 80;

      let directionX = centerX - startPosition.x;
      let directionY = centerY - startPosition.y;
      const directionLength = Math.hypot(directionX, directionY) || 1;
      directionX /= directionLength;
      directionY /= directionLength;

      const message = {
        element,
        text,
        x: startPosition.x,
        y: startPosition.y,
        vx: directionX * speed + Math.cos(angle) * 18,
        vy: directionY * speed + Math.sin(angle) * 18,
        rotation: (Math.random() - 0.5) * 18,
        spin: (Math.random() - 0.5) * 24,
        bornAt: now,
        lastUpdate: now,
        lastPointerX: startPosition.x,
        lastPointerY: startPosition.y,
        lastPointerTime: now,
        sticky: isSticky,
        dragging: false,
        pointerId: null,
        dragOffsetX: 0,
        dragOffsetY: 0
      };

      element.style.opacity = '0';
      applyMessageTransform(message, 0.42);
      element.style.zIndex = String(40 + floatingMessages.length);

      element.addEventListener('pointerdown', (event) => {
        message.dragging = true;
        message.pointerId = event.pointerId;
        element.setPointerCapture(event.pointerId);
        element.classList.add('is-dragging');
        message.dragOffsetX = event.clientX - message.x;
        message.dragOffsetY = event.clientY - message.y;
        message.lastPointerX = event.clientX;
        message.lastPointerY = event.clientY;
        message.lastPointerTime = performance.now();
        event.preventDefault();
      });

      element.addEventListener('pointermove', (event) => {
        if (!message.dragging || event.pointerId !== message.pointerId) {
          return;
        }

        const now = performance.now();
        const deltaTime = Math.max((now - message.lastPointerTime) / 1000, 0.016);
        const pointerDeltaX = event.clientX - message.lastPointerX;
        const pointerDeltaY = event.clientY - message.lastPointerY;
        const bounds = getViewportBounds(message.element);
        message.x = clamp(event.clientX - message.dragOffsetX, bounds.minX, bounds.maxX);
        message.y = clamp(event.clientY - message.dragOffsetY, bounds.minY, bounds.maxY);
        message.vx = clamp(pointerDeltaX / deltaTime, -900, 900);
        message.vy = clamp(pointerDeltaY / deltaTime, -900, 900);
        message.spin = clamp(message.spin + (pointerDeltaX - pointerDeltaY) * 0.015, -180, 180);
        message.rotation += (pointerDeltaX + pointerDeltaY) * 0.02;
        message.lastPointerX = event.clientX;
        message.lastPointerY = event.clientY;
        message.lastPointerTime = now;
      });

      function finishDrag(event) {
        if (event.pointerId !== message.pointerId) {
          return;
        }

        message.dragging = false;
        message.pointerId = null;
        element.classList.remove('is-dragging');
        message.vx *= 0.92;
        message.vy *= 0.92;
      }

      element.addEventListener('pointerup', finishDrag);
      element.addEventListener('pointercancel', finishDrag);

      floatingMessages.push(message);
      return message;
    }

    function startMessageBursts() {
      if (messageTimer) {
        clearInterval(messageTimer);
      }

      messageTimer = setInterval(() => {
        if (!countdownComplete && messagesSpawned < totalMessages) {
          spawnMessage();
          messagesSpawned += 1;

          if (messagesSpawned >= totalMessages) {
            stopMessageBursts();
          }
        }
      }, spawnIntervalMs);
    }

    function stopMessageBursts() {
      if (messageTimer) {
        clearInterval(messageTimer);
        messageTimer = null;
      }
    }

    function updateMessages(now) {
      for (let index = floatingMessages.length - 1; index >= 0; index -= 1) {
        const message = floatingMessages[index];

        if (!message.dragging) {
          const deltaSeconds = Math.min((now - message.lastUpdate) / 1000, 0.034);
          message.lastUpdate = now;

          message.x += message.vx * deltaSeconds;
          message.y += message.vy * deltaSeconds;
          message.rotation += message.spin * deltaSeconds;

          const bounds = getViewportBounds(message.element);

          if (message.x <= bounds.minX || message.x >= bounds.maxX) {
            message.vx *= -1;
            message.vx *= 0.96;
            message.x = clamp(message.x, bounds.minX, bounds.maxX);
          }

          if (message.y <= bounds.minY || message.y >= bounds.maxY) {
            message.vy *= -1;
            message.vy *= 0.96;
            message.y = clamp(message.y, bounds.minY, bounds.maxY);
          }

            message.vx *= 0.9995;
            message.vy *= 0.9995;
        }

        const age = now - message.bornAt;
          const burstScale = age < 220 ? 0.46 + (age / 220) * 0.54 : 1;
          const floatPulse = message.dragging ? 1 : 1 + Math.sin((now / 1200) + (index * 0.5)) * 0.01;

        message.element.style.opacity = String(Math.min(age / 240, 1));
        applyMessageTransform(message, burstScale * floatPulse);
      }
    }

    function animateMessages(now) {
      updateMessages(now);
      animationFrameId = requestAnimationFrame(animateMessages);
    }

    function render() {
      const now = new Date();
      const target = getTargetDate(now);
      const remaining = target - now;

      if (remaining <= 0) {
        weeksEl.textContent = '00';
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        celebrateEl.classList.add('show');

        if (!countdownComplete) {
          countdownComplete = true;
          stopMessageBursts();
          spawnMessage('It is officially Raksha bandhan. Brother-sister chaos unlocked.', { sticky: true });
        }

        return;
      }

      celebrateEl.classList.remove('show');

      const totalSeconds = Math.floor(remaining / 1000);
      const weeks = Math.floor(totalSeconds / (7 * 24 * 60 * 60));
      const days = Math.floor((totalSeconds % (7 * 24 * 60 * 60)) / (24 * 60 * 60));
      const hours = Math.floor((totalSeconds % (24 * 60 * 60)) / (60 * 60));
      const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
      const seconds = totalSeconds % 60;

      weeksEl.textContent = pad(weeks);
      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    startMessageBursts();
    animationFrameId = requestAnimationFrame(animateMessages);
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
