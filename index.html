<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshabandhan Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .wrap {
      width: min(1100px, calc(100vw - 32px));
      text-align: center;
      padding: 32px 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 4rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 30px;
      color: var(--muted);
      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      letter-spacing: 0.02em;
    }

    .hype {
      margin: 20px 0 0;
      min-height: 4.5rem;
      position: relative;
      display: grid;
      place-items: center;
      overflow: visible;
      touch-action: none;
      user-select: none;
    }

    .hype-burst {
      position: relative;
      display: inline-block;
      max-width: min(680px, 92vw);
      padding: 0.9rem 1.2rem;
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.96);
      font-size: clamp(0.95rem, 1.7vw, 1.15rem);
      letter-spacing: 0.04em;
      text-wrap: balance;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), rgba(255, 209, 102, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 18px 60px rgba(255, 200, 70, 0.12),
        0 0 32px rgba(255, 255, 255, 0.08);
      transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(var(--scale, 1));
      transition:
        transform 240ms cubic-bezier(0.2, 0.9, 0.2, 1),
        opacity 240ms ease,
        filter 240ms ease;
      opacity: 0;
      filter: blur(8px) saturate(1.15);
      pointer-events: auto;
      will-change: transform, opacity, filter;
    }

    .hype-burst.show {
      opacity: 1;
      filter: blur(0) saturate(1);
      animation: burstFloat 8s ease-in-out infinite alternate;
    }

    .hype-burst.is-dragging {
      animation: none;
      transition: none;
      cursor: grabbing;
    }

    .hype-burst::before,
    .hype-burst::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.55;
    }

    .hype-burst::before {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 62%);
      filter: blur(10px);
      transform: scale(1.08);
    }

    .hype-burst::after {
      inset: -24px;
      background: radial-gradient(circle, rgba(255, 197, 84, 0.22), transparent 58%);
      filter: blur(18px);
      transform: scale(1.15);
    }

    @keyframes burstFloat {
      0% {
        transform: translate3d(var(--x, 0px), var(--y, 0px), 0) scale(var(--scale, 1));
      }

      25% {
        transform: translate3d(calc(var(--x, 0px) + 12px), calc(var(--y, 0px) - 10px), 0) scale(calc(var(--scale, 1) + 0.03));
      }

      50% {
        transform: translate3d(calc(var(--x, 0px) - 10px), calc(var(--y, 0px) - 18px), 0) scale(calc(var(--scale, 1) + 0.06));
      }

      75% {
        transform: translate3d(calc(var(--x, 0px) + 8px), calc(var(--y, 0px) - 28px), 0) scale(calc(var(--scale, 1) + 0.03));
      }

      100% {
        transform: translate3d(calc(var(--x, 0px) - 6px), calc(var(--y, 0px) - 40px), 0) scale(var(--scale, 1));
      }
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .unit {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 12px 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(255, 255, 255, 0.04);
    }

    .value {
      display: block;
      font-size: clamp(2rem, 7vw, 4.8rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .label {
      display: block;
      margin-top: 10px;
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .celebrate {
      margin-top: 26px;
      font-size: clamp(1.4rem, 2.5vw, 2.2rem);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 700;
      display: none;
    }

    .celebrate.show {
      display: block;
    }

    @media (max-width: 760px) {
      .timer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .unit:nth-child(5) {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 460px) {
      .wrap {
        width: min(100vw - 20px, 100%);
      }

      .timer {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .unit {
        padding: 18px 10px 14px;
        border-radius: 16px;
      }

      .hype-burst {
        max-width: 88vw;
        padding: 0.8rem 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="wrap" aria-label="Rakshabandhan countdown timer">
    <h1>Rakshabandhan</h1>
    <p class="subtitle">A tiny countdown for big sibling energy.</p>

    <section class="timer" aria-live="polite">
      <div class="unit">
        <span class="value" id="weeks">00</span>
        <span class="label">Weeks</span>
      </div>
      <div class="unit">
        <span class="value" id="days">00</span>
        <span class="label">Days</span>
      </div>
      <div class="unit">
        <span class="value" id="hours">00</span>
        <span class="label">Hours</span>
      </div>
      <div class="unit">
        <span class="value" id="minutes">00</span>
        <span class="label">Minutes</span>
      </div>
      <div class="unit">
        <span class="value" id="seconds">00</span>
        <span class="label">Seconds</span>
      </div>
    </section>

    <p class="hype" id="hype" aria-label="Rotating sibling reminders">
      <span class="hype-burst" id="hypeBurst">Loading sibling drama...</span>
    </p>

    <div class="celebrate" id="celebrate">Happy Rakshabandhan</div>
    
  </main>

  <script>
    const weeksEl = document.getElementById('weeks');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const celebrateEl = document.getElementById('celebrate');
    const hypeEl = document.getElementById('hype');
    const hypeBurstEl = document.getElementById('hypeBurst');

    const hypeLines = [
      'Nishtha ABCD yaad karke aana.',
      'Jinal time pe aajana',
      'Vibhu khota mat lagana pls',
      'Vidhi painting mat bhoolna',
      'Vivek bhaiya is baar aajana 😭',
      'SMEET IS BAR AYEGA',
      'Sabko aana hai, kya pata, kal ho na ho?'
    ];

    const floatState = {
      x: 0,
      y: 0,
      vx: 0.18,
      vy: -0.22,
      scale: 1,
      dragging: false,
      pointerId: null,
      offsetX: 0,
      offsetY: 0
    };

    let hypeIndex = 0;
    let hypeTimer = null;
    let floatFrame = null;
    let countdownComplete = false;

    function getTargetDate(now) {
      const year = now.getFullYear();
      let target = new Date(year, 7, 28, 0, 0, 0, 0);

      if (now > target) {
        target = new Date(year + 1, 7, 28, 0, 0, 0, 0);
      }

      return target;
    }

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function applyHypeTransform() {
      hypeBurstEl.style.setProperty('--x', `${floatState.x}px`);
      hypeBurstEl.style.setProperty('--y', `${floatState.y}px`);
      hypeBurstEl.style.setProperty('--scale', floatState.scale.toFixed(3));
    }

    function burstHypeLine() {
      hypeIndex = (hypeIndex + 1) % hypeLines.length;
      hypeBurstEl.textContent = hypeLines[hypeIndex];
      hypeBurstEl.classList.remove('show');
      hypeBurstEl.style.setProperty('--scale', '0.82');
      floatState.scale = 0.82;
      applyHypeTransform();

      requestAnimationFrame(() => {
        hypeBurstEl.classList.add('show');
        floatState.scale = 1;
        applyHypeTransform();
      });
    }

    function startHypeRotation() {
      if (hypeTimer) {
        clearInterval(hypeTimer);
      }

      hypeTimer = setInterval(burstHypeLine, 4200);
    }

    function stopHypeRotation() {
      if (hypeTimer) {
        clearInterval(hypeTimer);
        hypeTimer = null;
      }
    }

    function animateFloat() {
      if (!floatState.dragging) {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const burstRect = hypeBurstEl.getBoundingClientRect();
        const timerRect = document.querySelector('.timer').getBoundingClientRect();
        const minX = -(viewportWidth / 2 - burstRect.width / 2 - 18);
        const maxX = viewportWidth / 2 - burstRect.width / 2 - 18;
        const minY = timerRect.bottom - window.innerHeight / 2 + 18;
        const maxY = viewportHeight / 2 - burstRect.height / 2 - 12;

        floatState.x += floatState.vx;
        floatState.y += floatState.vy;

        if (floatState.x <= minX || floatState.x >= maxX) {
          floatState.vx *= -1;
          floatState.x = Math.min(Math.max(floatState.x, minX), maxX);
        }

        if (floatState.y <= minY || floatState.y >= maxY) {
          floatState.vy *= -1;
          floatState.y = Math.min(Math.max(floatState.y, minY), maxY);
        }

        applyHypeTransform();
      }

      floatFrame = requestAnimationFrame(animateFloat);
    }

    function clampBurstPosition(nextX, nextY) {
      const viewportWidth = window.innerWidth;
      const viewportHeight = window.innerHeight;
      const burstRect = hypeBurstEl.getBoundingClientRect();
      const timerRect = document.querySelector('.timer').getBoundingClientRect();
      const minX = -(viewportWidth / 2 - burstRect.width / 2 - 18);
      const maxX = viewportWidth / 2 - burstRect.width / 2 - 18;
      const minY = timerRect.bottom - window.innerHeight / 2 + 18;
      const maxY = viewportHeight / 2 - burstRect.height / 2 - 12;

      return {
        x: Math.min(Math.max(nextX, minX), maxX),
        y: Math.min(Math.max(nextY, minY), maxY)
      };
    }

    hypeBurstEl.addEventListener('pointerdown', (event) => {
      floatState.dragging = true;
      floatState.pointerId = event.pointerId;
      hypeBurstEl.setPointerCapture(event.pointerId);
      hypeBurstEl.classList.add('is-dragging');

      const rect = hypeBurstEl.getBoundingClientRect();
      floatState.offsetX = event.clientX - (rect.left + rect.width / 2);
      floatState.offsetY = event.clientY - (rect.top + rect.height / 2);
      event.preventDefault();
    });

    hypeBurstEl.addEventListener('pointermove', (event) => {
      if (!floatState.dragging || event.pointerId !== floatState.pointerId) {
        return;
      }

      const next = clampBurstPosition(
        event.clientX - window.innerWidth / 2 - floatState.offsetX,
        event.clientY - window.innerHeight / 2 - floatState.offsetY
      );

      floatState.x = next.x;
      floatState.y = next.y;
      floatState.vx = 0;
      floatState.vy = 0;
      applyHypeTransform();
    });

    function endDrag(event) {
      if (event.pointerId !== floatState.pointerId) {
        return;
      }

      floatState.dragging = false;
      floatState.pointerId = null;
      hypeBurstEl.classList.remove('is-dragging');
      floatState.vx = (Math.random() > 0.5 ? 1 : -1) * (0.14 + Math.random() * 0.12);
      floatState.vy = -(0.12 + Math.random() * 0.14);
    }

    hypeBurstEl.addEventListener('pointerup', endDrag);
    hypeBurstEl.addEventListener('pointercancel', endDrag);

    function render() {
      const now = new Date();
      const target = getTargetDate(now);
      let remaining = target - now;

      if (remaining <= 0) {
        if (!countdownComplete) {
          countdownComplete = true;
          stopHypeRotation();
        }

        weeksEl.textContent = '00';
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        celebrateEl.classList.add('show');
        hypeEl.textContent = 'It is officially Rakshabandhan. Brother-sister chaos unlocked.';
        hypeBurstEl.textContent = 'It is officially Rakshabandhan. Brother-sister chaos unlocked.';
        hypeBurstEl.classList.add('show');
        return;
      }

      celebrateEl.classList.remove('show');

      const totalSeconds = Math.floor(remaining / 1000);
      const weeks = Math.floor(totalSeconds / (7 * 24 * 60 * 60));
      const days = Math.floor((totalSeconds % (7 * 24 * 60 * 60)) / (24 * 60 * 60));
      const hours = Math.floor((totalSeconds % (24 * 60 * 60)) / (60 * 60));
      const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
      const seconds = totalSeconds % 60;

      weeksEl.textContent = pad(weeks);
      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
      if (!hypeBurstEl.classList.contains('show')) {
        hypeBurstEl.textContent = hypeLines[hypeIndex];
        hypeBurstEl.classList.add('show');
      }

      hypeEl.setAttribute('aria-live', floatState.dragging ? 'off' : 'polite');
    }

    hypeBurstEl.classList.add('show');
    applyHypeTransform();
    startHypeRotation();
    floatFrame = requestAnimationFrame(animateFloat);
    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
