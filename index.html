<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshabandhan Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.74);
      --panel: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: var(--fg);
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 45%),
                  linear-gradient(to bottom, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.58));
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr;
      pointer-events: none;
      padding: 20px;
    }

    .header {
      align-self: start;
      justify-self: center;
      width: min(1100px, 100%);
      text-align: center;
      padding: 14px 18px 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(255, 255, 255, 0.05);
      margin-top: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3.2vw, 3.4rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(0.92rem, 1.3vw, 1.05rem);
      letter-spacing: 0.03em;
    }

    .content {
      align-self: end;
      justify-self: center;
      width: min(1140px, 100%);
      padding-bottom: 6px;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      pointer-events: auto;
    }

    .unit {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 12px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 48px rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .value {
      display: block;
      font-size: clamp(1.8rem, 5.4vw, 4rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--muted);
    }

    .hype {
      margin: 12px 0 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.84);
      font-size: 0.96rem;
      min-height: 1.3em;
      letter-spacing: 0.03em;
    }

    .celebrate {
      margin: 14px 0 0;
      text-align: center;
      display: none;
      font-size: clamp(1.1rem, 2.5vw, 1.7rem);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .celebrate.show {
      display: block;
    }

    @media (max-width: 760px) {
      .overlay {
        padding: 14px;
      }

      .timer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .unit:nth-child(5) {
        grid-column: 1 / -1;
      }

      .header {
        border-radius: 18px;
      }
    }

    @media (max-width: 460px) {
      .timer {
        gap: 10px;
      }

      .unit {
        padding: 14px 10px 12px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>

  <main class="overlay" aria-label="Rakshabandhan countdown timer">
    <header class="header">
      <h1>Rakshabandhan</h1>
      <p class="subtitle">A tiny countdown for big sibling energy.</p>
    </header>

    <section class="content">
      <section class="timer" aria-live="polite">
        <div class="unit">
          <span class="value" id="weeks">00</span>
          <span class="label">Weeks</span>
        </div>
        <div class="unit">
          <span class="value" id="days">00</span>
          <span class="label">Days</span>
        </div>
        <div class="unit">
          <span class="value" id="hours">00</span>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <span class="value" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>
        <div class="unit">
          <span class="value" id="seconds">00</span>
          <span class="label">Seconds</span>
        </div>
      </section>

      <p class="hype" id="hype">Loading sibling drama...</p>
      <div class="celebrate" id="celebrate">Happy Rakshabandhan</div>
    </section>
  </main>

  <script>
    const weeksEl = document.getElementById('weeks');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const celebrateEl = document.getElementById('celebrate');
    const hypeEl = document.getElementById('hype');

    const hypeLines = [
      'Brace yourself. The tying of rakhi is approaching.',
      'Sibling truce negotiations are now officially active.',
      'Prepare for gifts, jokes, and selective emotional damage.',
      'The festival of protection and playful bargaining is near.',
      'One thread. Infinite family drama.'
    ];

    function getTargetDate(now) {
      const year = now.getFullYear();
      let target = new Date(year, 7, 28, 0, 0, 0, 0);

      if (now > target) {
        target = new Date(year + 1, 7, 28, 0, 0, 0, 0);
      }

      return target;
    }

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function renderCountdown() {
      const now = new Date();
      const target = getTargetDate(now);
      const remaining = target - now;

      if (remaining <= 0) {
        weeksEl.textContent = '00';
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        celebrateEl.classList.add('show');
        hypeEl.textContent = 'It is officially Rakshabandhan. Brother-sister chaos unlocked.';
        return;
      }

      celebrateEl.classList.remove('show');

      const totalSeconds = Math.floor(remaining / 1000);
      const weeks = Math.floor(totalSeconds / (7 * 24 * 60 * 60));
      const days = Math.floor((totalSeconds % (7 * 24 * 60 * 60)) / (24 * 60 * 60));
      const hours = Math.floor((totalSeconds % (24 * 60 * 60)) / (60 * 60));
      const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
      const seconds = totalSeconds % 60;

      weeksEl.textContent = pad(weeks);
      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
      hypeEl.textContent = hypeLines[totalSeconds % hypeLines.length];
    }

    function createNativeScene() {
      const container = document.getElementById('scene');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      container.appendChild(canvas);

      const state = {
        width: 0,
        height: 0,
        pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        frame: 0,
        stars: [],
        swimmers: [],
        rope: [],
        particles: [],
      };

      function resize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.pixelRatio);
        canvas.height = Math.floor(state.height * state.pixelRatio);
        canvas.style.width = state.width + 'px';
        canvas.style.height = state.height + 'px';
        ctx.setTransform(state.pixelRatio, 0, 0, state.pixelRatio, 0, 0);
        buildStars();
        buildSwimmers();
        buildRope();
      }

      function buildStars() {
        state.stars = [];
        const count = Math.floor((state.width * state.height) / 1250);
        for (let i = 0; i < count; i += 1) {
          state.stars.push({
            x: Math.random() * state.width,
            y: Math.random() * state.height,
            r: 0.4 + Math.random() * 1.4,
            speed: 0.08 + Math.random() * 0.35,
            twinkle: Math.random() * Math.PI * 2,
          });
        }
      }

      function buildSwimmers() {
        state.swimmers = [];
        const left = state.width * 0.08;
        const spread = state.height * 0.64;
        for (let i = 0; i < 14; i += 1) {
          state.swimmers.push({
            x: left + (Math.random() * state.width * 0.28),
            y: state.height * 0.18 + (i / 13) * spread + (Math.random() * 18 - 9),
            z: -0.35 + Math.random() * 0.7,
            vx: 0.55 + Math.random() * 0.65,
            vy: (Math.random() - 0.5) * 0.18,
            vz: (Math.random() - 0.5) * 0.03,
            phase: i * 0.75 + Math.random(),
            size: 0.78 + Math.random() * 0.28,
            reach: 0.75 + Math.random() * 0.45,
            colorShift: Math.random(),
            splash: 0,
          });
        }
      }

      function buildRope() {
        const segmentCount = 44;
        state.rope = [];
        const anchor = getHouseAnchor();
        const startX = state.width * 0.36;
        const startY = state.height * 0.41;
        for (let i = 0; i < segmentCount; i += 1) {
          const t = i / (segmentCount - 1);
          state.rope.push({
            x: startX + (anchor.x - startX) * t,
            y: startY + (anchor.y - startY) * t,
            vx: 0,
            vy: 0,
            pinned: i === 0 || i === segmentCount - 1,
            mass: i === 0 || i === segmentCount - 1 ? 0 : 1,
          });
        }
      }

      function getHouseAnchor() {
        return {
          x: state.width * 0.79,
          y: state.height * 0.47,
        };
      }

      function drawRoundedRect(x, y, w, h, radius) {
        const r = Math.min(radius, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function updatePhysics() {
        const dt = 1;
        const anchor = getHouseAnchor();
        const ropeAnchor = { x: state.width * 0.68, y: state.height * 0.42 };

        state.swimmers.forEach((swimmer, index) => {
          const lane = state.height * 0.16 + (index / 13) * state.height * 0.58;
          const targetX = state.width * 0.56 + Math.sin(state.frame * 0.012 + swimmer.phase) * 34;
          const accelX = (targetX - swimmer.x) * 0.0009;
          const accelY = (lane - swimmer.y) * 0.0012 + Math.sin(state.frame * 0.05 + swimmer.phase) * 0.02;
          swimmer.vx = (swimmer.vx + accelX) * 0.992;
          swimmer.vy = (swimmer.vy + accelY) * 0.988;
          swimmer.vz += Math.sin(state.frame * 0.02 + swimmer.phase) * 0.0006;
          swimmer.vz *= 0.96;
          swimmer.x += swimmer.vx * dt;
          swimmer.y += swimmer.vy * dt;
          swimmer.z += swimmer.vz * dt;

          if (swimmer.x > state.width * 0.58) {
            swimmer.x = state.width * 0.08 - Math.random() * 40;
            swimmer.y = lane + (Math.random() * 24 - 12);
            swimmer.vx = 0.55 + Math.random() * 0.5;
            swimmer.splash = 8 + Math.random() * 12;
          }

          if (swimmer.splash > 0) {
            swimmer.splash -= 0.35;
          }

          if (Math.random() < 0.03) {
            state.particles.push({
              x: swimmer.x - 24,
              y: swimmer.y + 8,
              vx: -0.25 - Math.random() * 0.4,
              vy: -0.2 - Math.random() * 0.3,
              life: 30 + Math.random() * 20,
              size: 0.8 + Math.random() * 1.8,
            });
          }
        });

        for (let i = 0; i < state.rope.length; i += 1) {
          const point = state.rope[i];
          if (i === 0) {
            point.x = state.width * 0.34 + Math.sin(state.frame * 0.015) * 10;
            point.y = state.height * 0.42 + Math.sin(state.frame * 0.02) * 6;
            continue;
          }
          if (i === state.rope.length - 1) {
            point.x = anchor.x;
            point.y = anchor.y;
            continue;
          }

          point.vy += 0.18 * dt;
          point.vx += Math.sin(state.frame * 0.08 + i * 0.32) * 0.02;
          point.vx *= 0.985;
          point.vy *= 0.985;
          point.x += point.vx;
          point.y += point.vy;
        }

        for (let iter = 0; iter < 8; iter += 1) {
          for (let i = 0; i < state.rope.length - 1; i += 1) {
            const a = state.rope[i];
            const b = state.rope[i + 1];
            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const dist = Math.max(0.0001, Math.hypot(dx, dy));
            const rest = lerp(10.5, 14.5, i / (state.rope.length - 1));
            const diff = (dist - rest) / dist;
            const stiffness = 0.34;
            const offsetX = dx * diff * stiffness;
            const offsetY = dy * diff * stiffness;

            if (i !== 0) {
              a.x += offsetX * 0.5;
              a.y += offsetY * 0.5;
            }
            if (i + 1 !== state.rope.length - 1) {
              b.x -= offsetX * 0.5;
              b.y -= offsetY * 0.5;
            }
          }
        }

        state.particles = state.particles.filter((particle) => {
          particle.vy += 0.015;
          particle.x += particle.vx;
          particle.y += particle.vy;
          particle.life -= 1;
          return particle.life > 0;
        });

        return { anchor, ropeAnchor };
      }

      function drawStars() {
        for (const star of state.stars) {
          star.twinkle += 0.02 + star.speed * 0.01;
          const alpha = 0.35 + Math.sin(star.twinkle) * 0.35;
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
          star.y += star.speed * 0.04;
          if (star.y > state.height + 10) {
            star.y = -10;
            star.x = Math.random() * state.width;
          }
        }
      }

      function drawBackground() {
        const gradient = ctx.createRadialGradient(
          state.width * 0.5,
          state.height * 0.35,
          20,
          state.width * 0.5,
          state.height * 0.35,
          Math.max(state.width, state.height) * 0.8
        );
        gradient.addColorStop(0, 'rgba(36,36,36,0.95)');
        gradient.addColorStop(0.4, 'rgba(10,10,10,0.98)');
        gradient.addColorStop(1, '#000000');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, state.width, state.height);

        const vignette = ctx.createRadialGradient(
          state.width * 0.5,
          state.height * 0.5,
          Math.min(state.width, state.height) * 0.12,
          state.width * 0.5,
          state.height * 0.5,
          Math.max(state.width, state.height) * 0.72
        );
        vignette.addColorStop(0, 'rgba(255,255,255,0.05)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.2)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, state.width, state.height);

        const waveCount = 8;
        for (let i = 0; i < waveCount; i += 1) {
          const y = state.height * (0.14 + i * 0.11);
          ctx.strokeStyle = `rgba(255,255,255,${0.02 + i * 0.004})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = 0; x <= state.width; x += 40) {
            const offset = Math.sin(x * 0.01 + state.frame * 0.012 + i) * (4 + i);
            if (x === 0) ctx.moveTo(x, y + offset);
            else ctx.lineTo(x, y + offset);
          }
          ctx.stroke();
        }
      }

      function drawHouse(anchor) {
        const cx = state.width * 0.79;
        const cy = state.height * 0.5;
        const bodyW = 220;
        const bodyH = 168;
        const depth = 26;
        const sway = Math.sin(state.frame * 0.014) * 3;
        const glow = ctx.createRadialGradient(cx, cy - 10, 18, cx, cy - 10, 210);
        glow.addColorStop(0, 'rgba(255, 214, 138, 0.42)');
        glow.addColorStop(1, 'rgba(255, 214, 138, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy - 6, 210, 0, Math.PI * 2);
        ctx.fill();

        const shadow = ctx.createRadialGradient(cx, cy + 86, 18, cx, cy + 86, 190);
        shadow.addColorStop(0, 'rgba(255,255,255,0.09)');
        shadow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = shadow;
        ctx.beginPath();
        ctx.arc(cx, cy + 78, 180, 0, Math.PI * 2);
        ctx.fill();

        const px = cx - bodyW / 2 + sway;
        const py = cy - bodyH / 2;

        ctx.fillStyle = 'rgba(238,236,230,0.96)';
        drawRoundedRect(px, py, bodyW, bodyH, 12);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        drawRoundedRect(px - depth * 0.45, py + 10, depth, bodyH - 18, 10);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + bodyW, py);
        ctx.lineTo(px + bodyW - 32, py - 52);
        ctx.lineTo(px + 26, py - 52);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.98)';
        ctx.beginPath();
        ctx.moveTo(px - 18, py);
        ctx.lineTo(px + bodyW / 2, py - 74);
        ctx.lineTo(px + bodyW + 18, py);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(42,42,42,0.94)';
        drawRoundedRect(cx - 18, py + 74, 36, 80, 9);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.94)';
        drawRoundedRect(cx - 84, py + 38, 28, 28, 5);
        drawRoundedRect(cx + 56, py + 38, 28, 28, 5);
        drawRoundedRect(cx - 84, py + 94, 28, 28, 5);
        drawRoundedRect(cx + 56, py + 94, 28, 28, 5);
        ctx.fill();

        ctx.save();
        ctx.translate(cx, py + 90);
        ctx.scale(1.2, 1);
        ctx.strokeStyle = 'rgba(255, 210, 106, 0.95)';
        ctx.lineWidth = 14;
        ctx.shadowColor = 'rgba(255, 190, 70, 0.95)';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(0, 0, 58, Math.PI * 0.08, Math.PI * 0.92);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 124, 164, 0.96)';
        ctx.lineWidth = 7;
        ctx.beginPath();
        ctx.arc(0, 0, 58, Math.PI * 0.96, Math.PI * 1.34);
        ctx.stroke();
        ctx.fillStyle = 'rgba(255, 124, 164, 0.96)';
        ctx.beginPath();
        ctx.arc(0, 2, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = 'rgba(255, 210, 106, 0.82)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(cx - 58, py + 92);
        ctx.lineTo(anchor.x + 12, anchor.y - 8);
        ctx.moveTo(cx + 58, py + 92);
        ctx.lineTo(anchor.x + 24, anchor.y + 10);
        ctx.stroke();
      }

      function drawSwimmer(swimmer) {
        const perspective = 1.08 + swimmer.z * 0.12;
        const x = swimmer.x;
        const y = swimmer.y;
        const bodyW = 66 * swimmer.size * perspective;
        const bodyH = 22 * swimmer.size * perspective;
        const headR = 12 * swimmer.size * perspective;
        const armSwing = Math.sin(state.frame * 0.08 + swimmer.phase) * 0.95;
        const legSwing = Math.sin(state.frame * 0.1 + swimmer.phase + 1.5) * 0.9;
        const waterGlow = swimmer.splash > 0 ? 0.35 : 0.15;

        ctx.save();
        ctx.translate(x, y);
        ctx.scale(1, 1 + swimmer.z * 0.05);

        const glow = ctx.createRadialGradient(0, 0, 8, 0, 0, 56 * swimmer.size);
        glow.addColorStop(0, `rgba(255,255,255,${0.14 + waterGlow})`);
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.ellipse(0, 0, 56 * swimmer.size, 30 * swimmer.size, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.ellipse(-10 * swimmer.size, -18 * swimmer.size, headR * 1.04, headR * 1.18, -0.15, 0, Math.PI * 2);
        ctx.fill();

        const bodyGradient = ctx.createLinearGradient(-bodyW / 2, -bodyH / 2, bodyW / 2, bodyH / 2);
        bodyGradient.addColorStop(0, 'rgba(255,255,255,0.98)');
        bodyGradient.addColorStop(0.45, 'rgba(225,225,225,0.96)');
        bodyGradient.addColorStop(1, 'rgba(180,180,180,0.82)');
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.ellipse(0, 0, bodyW / 2, bodyH / 2, 0.15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.ellipse(-10 * swimmer.size, -20 * swimmer.size, headR * 0.55, headR * 0.3, -0.35, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.92)';
        ctx.lineWidth = 4.5 * swimmer.size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-18 * swimmer.size, -2 * swimmer.size);
        ctx.quadraticCurveTo(-34 * swimmer.size, -22 * swimmer.size + armSwing * 5, -54 * swimmer.size, -8 * swimmer.size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(8 * swimmer.size, 0);
        ctx.quadraticCurveTo(24 * swimmer.size, -18 * swimmer.size - armSwing * 5, 48 * swimmer.size, -10 * swimmer.size);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(230,230,230,0.88)';
        ctx.lineWidth = 4.1 * swimmer.size;
        ctx.beginPath();
        ctx.moveTo(-6 * swimmer.size, 8 * swimmer.size);
        ctx.quadraticCurveTo(-22 * swimmer.size, 22 * swimmer.size + legSwing * 6, -42 * swimmer.size, 24 * swimmer.size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(12 * swimmer.size, 8 * swimmer.size);
        ctx.quadraticCurveTo(28 * swimmer.size, 20 * swimmer.size - legSwing * 6, 48 * swimmer.size, 22 * swimmer.size);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,210,106,0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-62 * swimmer.size, 12 * swimmer.size);
        ctx.lineTo(-78 * swimmer.size, 18 * swimmer.size);
        ctx.moveTo(54 * swimmer.size, 10 * swimmer.size);
        ctx.lineTo(68 * swimmer.size, 18 * swimmer.size);
        ctx.stroke();

        if (swimmer.splash > 0) {
          ctx.strokeStyle = 'rgba(255,255,255,0.45)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(-70 * swimmer.size, 18 * swimmer.size, 8 + swimmer.splash * 0.45, 0, Math.PI * 2);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(68 * swimmer.size, 18 * swimmer.size, 7 + swimmer.splash * 0.35, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.restore();
      }

      function animate() {
        state.frame += 1;
        drawBackground();
        drawStars();

        const { anchor } = updatePhysics();
        drawHouse(anchor);

        const ropePoints = state.rope;
        ctx.save();
        ctx.lineCap = 'round';
        for (let layer = 0; layer < 4; layer += 1) {
          const lineWidth = 8 - layer * 1.5;
          ctx.strokeStyle = layer === 0 ? 'rgba(255,210,106,0.95)' : layer === 1 ? 'rgba(255,124,164,0.9)' : layer === 2 ? 'rgba(255,235,190,0.7)' : 'rgba(255,255,255,0.5)';
          ctx.lineWidth = lineWidth;
          ctx.beginPath();
          ropePoints.forEach((point, index) => {
            if (index === 0) {
              ctx.moveTo(point.x, point.y + layer * 0.6);
            } else {
              const nextPoint = ropePoints[index];
              const prevPoint = ropePoints[index - 1];
              const cx1 = prevPoint.x + (nextPoint.x - prevPoint.x) * 0.45;
              const cy1 = prevPoint.y + (nextPoint.y - prevPoint.y) * 0.45 + Math.sin(state.frame * 0.03 + index * 0.2) * (4 - layer);
              const cx2 = prevPoint.x + (nextPoint.x - prevPoint.x) * 0.55;
              const cy2 = prevPoint.y + (nextPoint.y - prevPoint.y) * 0.55 - Math.sin(state.frame * 0.028 + index * 0.24) * (3.5 - layer);
              ctx.bezierCurveTo(cx1, cy1, cx2, cy2, nextPoint.x, nextPoint.y);
            }
          });
          ctx.shadowColor = layer === 0 ? 'rgba(255,190,70,0.8)' : 'rgba(255,124,164,0.45)';
          ctx.shadowBlur = layer === 0 ? 18 : 8;
          ctx.stroke();
        }

        for (const point of ropePoints) {
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.beginPath();
          ctx.arc(point.x, point.y, 1.9, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        for (const particle of state.particles) {
          ctx.fillStyle = `rgba(255,255,255,${Math.max(0, particle.life / 50) * 0.7})`;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }

        state.swimmers.sort((a, b) => a.z - b.z);
        state.swimmers.forEach(drawSwimmer);

        const currentTargetX = state.width * 0.62;
        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        ctx.beginPath();
        ctx.arc(currentTargetX, state.height * 0.5, 62, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        requestAnimationFrame(animate);
      }

      resize();
      window.addEventListener('resize', resize);
      animate();
    }

    renderCountdown();
    setInterval(renderCountdown, 1000);
    createNativeScene();
  </script>
</body>
</html>
