<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rakshabandhan Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, 0.74);
      --panel: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: var(--fg);
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      position: relative;
    }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.08), transparent 45%),
                  linear-gradient(to bottom, rgba(0, 0, 0, 0.08), rgba(0, 0, 0, 0.58));
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr;
      pointer-events: none;
      padding: 20px;
    }

    .header {
      align-self: start;
      justify-self: center;
      width: min(1100px, 100%);
      text-align: center;
      padding: 14px 18px 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(0, 0, 0, 0.38);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(255, 255, 255, 0.05);
      margin-top: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3.2vw, 3.4rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(0.92rem, 1.3vw, 1.05rem);
      letter-spacing: 0.03em;
    }

    .content {
      align-self: end;
      justify-self: center;
      width: min(1140px, 100%);
      padding-bottom: 6px;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      pointer-events: auto;
    }

    .unit {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px 12px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 48px rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .value {
      display: block;
      font-size: clamp(1.8rem, 5.4vw, 4rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      color: var(--muted);
    }

    .hype {
      margin: 12px 0 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.84);
      font-size: 0.96rem;
      min-height: 1.3em;
      letter-spacing: 0.03em;
    }

    .celebrate {
      margin: 14px 0 0;
      text-align: center;
      display: none;
      font-size: clamp(1.1rem, 2.5vw, 1.7rem);
      letter-spacing: 0.09em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .celebrate.show {
      display: block;
    }

    @media (max-width: 760px) {
      .overlay {
        padding: 14px;
      }

      .timer {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .unit:nth-child(5) {
        grid-column: 1 / -1;
      }

      .header {
        border-radius: 18px;
      }
    }

    @media (max-width: 460px) {
      .timer {
        gap: 10px;
      }

      .unit {
        padding: 14px 10px 12px;
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>

  <main class="overlay" aria-label="Rakshabandhan countdown timer">
    <header class="header">
      <h1>Rakshabandhan</h1>
      <p class="subtitle">A tiny countdown for big sibling energy.</p>
    </header>

    <section class="content">
      <section class="timer" aria-live="polite">
        <div class="unit">
          <span class="value" id="weeks">00</span>
          <span class="label">Weeks</span>
        </div>
        <div class="unit">
          <span class="value" id="days">00</span>
          <span class="label">Days</span>
        </div>
        <div class="unit">
          <span class="value" id="hours">00</span>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <span class="value" id="minutes">00</span>
          <span class="label">Minutes</span>
        </div>
        <div class="unit">
          <span class="value" id="seconds">00</span>
          <span class="label">Seconds</span>
        </div>
      </section>

      <p class="hype" id="hype">Loading sibling drama...</p>
      <div class="celebrate" id="celebrate">Happy Rakshabandhan</div>
    </section>
  </main>

  <script>
    const weeksEl = document.getElementById('weeks');
    const daysEl = document.getElementById('days');
    const hoursEl = document.getElementById('hours');
    const minutesEl = document.getElementById('minutes');
    const secondsEl = document.getElementById('seconds');
    const celebrateEl = document.getElementById('celebrate');
    const hypeEl = document.getElementById('hype');

    const hypeLines = [
      'Brace yourself. The tying of rakhi is approaching.',
      'Sibling truce negotiations are now officially active.',
      'Prepare for gifts, jokes, and selective emotional damage.',
      'The festival of protection and playful bargaining is near.',
      'One thread. Infinite family drama.'
    ];

    function getTargetDate(now) {
      const year = now.getFullYear();
      let target = new Date(year, 7, 28, 0, 0, 0, 0);

      if (now > target) {
        target = new Date(year + 1, 7, 28, 0, 0, 0, 0);
      }

      return target;
    }

    function pad(value) {
      return String(value).padStart(2, '0');
    }

    function renderCountdown() {
      const now = new Date();
      const target = getTargetDate(now);
      const remaining = target - now;

      if (remaining <= 0) {
        weeksEl.textContent = '00';
        daysEl.textContent = '00';
        hoursEl.textContent = '00';
        minutesEl.textContent = '00';
        secondsEl.textContent = '00';
        celebrateEl.classList.add('show');
        hypeEl.textContent = 'It is officially Rakshabandhan. Brother-sister chaos unlocked.';
        return;
      }

      celebrateEl.classList.remove('show');

      const totalSeconds = Math.floor(remaining / 1000);
      const weeks = Math.floor(totalSeconds / (7 * 24 * 60 * 60));
      const days = Math.floor((totalSeconds % (7 * 24 * 60 * 60)) / (24 * 60 * 60));
      const hours = Math.floor((totalSeconds % (24 * 60 * 60)) / (60 * 60));
      const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
      const seconds = totalSeconds % 60;

      weeksEl.textContent = pad(weeks);
      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
      hypeEl.textContent = hypeLines[totalSeconds % hypeLines.length];
    }

    function createNativeScene() {
      const container = document.getElementById('scene');
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      container.appendChild(canvas);

      const state = {
        width: 0,
        height: 0,
        pixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        frame: 0,
        stars: [],
      };

      function resize() {
        state.width = window.innerWidth;
        state.height = window.innerHeight;
        canvas.width = Math.floor(state.width * state.pixelRatio);
        canvas.height = Math.floor(state.height * state.pixelRatio);
        canvas.style.width = state.width + 'px';
        canvas.style.height = state.height + 'px';
        ctx.setTransform(state.pixelRatio, 0, 0, state.pixelRatio, 0, 0);
        buildStars();
      }

      function buildStars() {
        state.stars = [];
        const count = Math.floor((state.width * state.height) / 1400);
        for (let i = 0; i < count; i += 1) {
          state.stars.push({
            x: Math.random() * state.width,
            y: Math.random() * state.height,
            r: 0.4 + Math.random() * 1.4,
            speed: 0.08 + Math.random() * 0.35,
            twinkle: Math.random() * Math.PI * 2,
          });
        }
      }

      function project(x, y, z) {
        const cameraDistance = 22;
        const scale = cameraDistance / (cameraDistance - z);
        return {
          x: state.width / 2 + x * scale * 34,
          y: state.height / 2 + y * scale * 34,
          scale,
          depth: z,
        };
      }

      function drawRoundedRect(x, y, w, h, radius) {
        const r = Math.min(radius, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawStars() {
        for (const star of state.stars) {
          star.twinkle += 0.02 + star.speed * 0.01;
          const alpha = 0.35 + Math.sin(star.twinkle) * 0.35;
          ctx.fillStyle = `rgba(255,255,255,${alpha})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fill();
          star.y += star.speed * 0.04;
          if (star.y > state.height + 10) {
            star.y = -10;
            star.x = Math.random() * state.width;
          }
        }
      }

      function drawBackground() {
        const gradient = ctx.createRadialGradient(
          state.width * 0.5,
          state.height * 0.35,
          20,
          state.width * 0.5,
          state.height * 0.35,
          Math.max(state.width, state.height) * 0.8
        );
        gradient.addColorStop(0, 'rgba(36,36,36,0.95)');
        gradient.addColorStop(0.4, 'rgba(10,10,10,0.98)');
        gradient.addColorStop(1, '#000000');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, state.width, state.height);

        const vignette = ctx.createRadialGradient(
          state.width * 0.5,
          state.height * 0.5,
          Math.min(state.width, state.height) * 0.12,
          state.width * 0.5,
          state.height * 0.5,
          Math.max(state.width, state.height) * 0.72
        );
        vignette.addColorStop(0, 'rgba(255,255,255,0.05)');
        vignette.addColorStop(1, 'rgba(0,0,0,0.2)');
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, state.width, state.height);
      }

      function drawHouse() {
        const cx = state.width * 0.5;
        const cy = state.height * 0.46;
        const bodyW = 190;
        const bodyH = 150;
        const depth = 20;
        const sway = Math.sin(state.frame * 0.014) * 4;
        const glow = ctx.createRadialGradient(cx, cy - 8, 10, cx, cy - 8, 170);
        glow.addColorStop(0, 'rgba(255, 214, 138, 0.28)');
        glow.addColorStop(1, 'rgba(255, 214, 138, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(cx, cy - 10, 170, 0, Math.PI * 2);
        ctx.fill();

        const shadow = ctx.createRadialGradient(cx, cy + 70, 10, cx, cy + 70, 160);
        shadow.addColorStop(0, 'rgba(255,255,255,0.07)');
        shadow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = shadow;
        ctx.beginPath();
        ctx.arc(cx, cy + 66, 150, 0, Math.PI * 2);
        ctx.fill();

        const px = cx - bodyW / 2 + sway;
        const py = cy - bodyH / 2;

        ctx.fillStyle = 'rgba(230,230,230,0.92)';
        drawRoundedRect(px, py, bodyW, bodyH, 10);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        drawRoundedRect(px - depth * 0.45, py + 8, depth, bodyH - 16, 8);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px + bodyW, py);
        ctx.lineTo(px + bodyW - 22, py - 42);
        ctx.lineTo(px + 20, py - 42);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.96)';
        ctx.beginPath();
        ctx.moveTo(px - 14, py);
        ctx.lineTo(px + bodyW / 2, py - 64);
        ctx.lineTo(px + bodyW + 14, py);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(40,40,40,0.92)';
        drawRoundedRect(cx - 16, py + 65, 32, 72, 8);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        drawRoundedRect(cx - 72, py + 34, 24, 24, 4);
        drawRoundedRect(cx + 48, py + 34, 24, 24, 4);
        drawRoundedRect(cx - 72, py + 82, 24, 24, 4);
        drawRoundedRect(cx + 48, py + 82, 24, 24, 4);
        ctx.fill();

        const bandY = py + 78;
        const bandX = cx;
        ctx.save();
        ctx.translate(bandX, bandY);
        ctx.scale(1.1, 1);
        ctx.strokeStyle = 'rgba(255, 210, 106, 0.95)';
        ctx.lineWidth = 11;
        ctx.shadowColor = 'rgba(255, 190, 70, 0.9)';
        ctx.shadowBlur = 16;
        ctx.beginPath();
        ctx.arc(0, 0, 47, Math.PI * 0.1, Math.PI * 0.9);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255, 124, 164, 0.95)';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(0, 0, 47, Math.PI * 0.98, Math.PI * 1.32);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255, 124, 164, 0.95)';
        ctx.beginPath();
        ctx.arc(0, 2, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = 'rgba(255, 210, 106, 0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 46, bandY + 2);
        ctx.lineTo(cx - 72, bandY + 30);
        ctx.moveTo(cx + 46, bandY + 2);
        ctx.lineTo(cx + 74, bandY + 24);
        ctx.stroke();
      }

      function drawFigure(figure) {
        const depth = figure.z;
        const base = project(figure.x, figure.y, depth);
        const scale = base.scale * figure.scale;
        const bob = Math.sin(state.frame * 0.035 + figure.phase) * 3.5;
        const x = base.x;
        const y = base.y + bob;

        const bodyW = 14 * scale;
        const bodyH = 30 * scale;
        const headR = 8 * scale;
        const armLen = 18 * scale;
        const legLen = 20 * scale;

        ctx.save();
        ctx.translate(x, y);
        ctx.globalAlpha = 0.82 + Math.max(0, 0.12 - depth * 0.01);
        ctx.lineCap = 'round';

        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = Math.max(1.2, 2.4 * scale);
        ctx.beginPath();
        ctx.arc(0, -bodyH - headR * 0.8, headR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(230,230,230,0.78)';
        ctx.lineWidth = Math.max(1.2, 3.2 * scale);
        ctx.beginPath();
        ctx.moveTo(0, -bodyH);
        ctx.lineTo(0, 0);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = Math.max(1.1, 2.2 * scale);
        ctx.beginPath();
        ctx.moveTo(0, -bodyH * 0.72);
        ctx.lineTo(-armLen * 0.72, -bodyH * 0.35);
        ctx.moveTo(0, -bodyH * 0.72);
        ctx.lineTo(armLen * 0.86, -bodyH * 0.32);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(220,220,220,0.72)';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-legLen * 0.45, legLen * 0.95);
        ctx.moveTo(0, 0);
        ctx.lineTo(legLen * 0.55, legLen * 0.9);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.arc(0, -bodyH - headR * 0.8, headR + 3 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      function animate() {
        state.frame += 1;
        drawBackground();
        drawStars();

        const figures = [];
        for (let i = 0; i < 14; i += 1) {
          const angle = (i / 14) * Math.PI * 2 + state.frame * 0.0035;
          const radius = 5.2 + (i % 3) * 0.45;
          const height = Math.sin(state.frame * 0.02 + i) * 0.55 + (i % 4) * 0.25;
          figures.push({
            x: Math.cos(angle) * radius,
            y: height + 0.2,
            z: Math.sin(angle) * radius,
            scale: 1.0 + (i % 4) * 0.04,
            phase: i * 0.75,
          });
        }

        figures.sort((a, b) => a.z - b.z);
        drawHouse();
        figures.forEach(drawFigure);

        requestAnimationFrame(animate);
      }

      resize();
      window.addEventListener('resize', resize);
      animate();
    }

    renderCountdown();
    setInterval(renderCountdown, 1000);
    createNativeScene();
  </script>
</body>
</html>
